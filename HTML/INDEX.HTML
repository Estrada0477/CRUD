<!-- FORMULARIO --><div class="container px-5 my-5">
    <form id="contactForm" data-sb-form-api-token="API_TOKEN">
        <div class="form-floating mb-3">
            <select class="form-select" id="escuela" aria-label="ESCUELA">
                <option value="TECNICA 96">TECNICA 96</option>
                <option value="TECNICA 92">TECNICA 92</option>
                <option value="TECNICA 74">TECNICA 74</option>
                <option value="TECNICA 72">TECNICA 72</option>
                <option value="OTRAS">OTRAS</option>
            </select>
            <label for="escuela">ESCUELA</label>
        </div>
        <div class="form-floating mb-3">
            <select class="form-select" id="tipoDeUniforme" aria-label="TIPO DE UNIFORME">
                <option value="DEPORTIVO">DEPORTIVO</option>
                <option value="DIARIO">DIARIO</option>
            </select>
            <label for="tipoDeUniforme">TIPO DE UNIFORME</label>
        </div>
        <div class="form-floating mb-3">
            <select class="form-select" id="talla" aria-label="TALLA">
                <option value="CHICO">CHICO</option>
                <option value="MEDIANO">MEDIANO</option>
                <option value="GRANDE">GRANDE</option>
                <option value="EXTRAGRANDE">EXTRAGRANDE</option>
            </select>
            <label for="talla">TALLA</label>
        </div>
        <div class="form-floating mb-3">
            <input class="form-control" id="nombre" type="text" placeholder="NOMBRE" data-sb-validations="required" />
            <label for="nombre">NOMBRE</label>
            <div class="invalid-feedback" data-sb-feedback="nombre:required">NOMBRE is required.</div>
        </div>
        <div class="form-floating mb-3">
            <textarea class="form-control" id="comentarios" type="text" placeholder="COMENTARIOS" style="height: 10rem;" data-sb-validations="required"></textarea>
            <label for="comentarios">COMENTARIOS</label>
            <div class="invalid-feedback" data-sb-feedback="comentarios:required">COMENTARIOS is required.</div>
        </div>
        <div class="d-none" id="submitSuccessMessage">
            <div class="text-center mb-3">
                <div class="fw-bolder">Form submission successful!</div>
                <p>To activate this form, sign up at</p>
                <a href="https://startbootstrap.com/solution/contact-forms">https://startbootstrap.com/solution/contact-forms</a>
            </div>
        </div>
        <div class="d-none" id="submitErrorMessage">
            <div class="text-center text-danger mb-3">Error sending message!</div>
        </div>
        <div class="d-grid">
            <button class="btn btn-primary btn-lg disabled" id="submitButton" type="submit">Submit</button>
        </div>
    </form>
</div>
